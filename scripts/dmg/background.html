<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Fraunces Variable";
    src: url("fraunces-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Inter Variable";
    src: url("inter-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "JetBrains Mono Variable";
    src: url("jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 660px;
    height: 420px;
    background: #F1ECE2;
    overflow: hidden;
  }
  body {
    position: relative;
    font-family: "Inter Variable", sans-serif;
  }
  .grain {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(21,20,14,0.05) 0.5px, transparent 0.5px);
    background-size: 3px 3px;
    opacity: 0.35;
    pointer-events: none;
  }
  .eyebrow {
    position: absolute;
    top: 34px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "JetBrains Mono Variable", monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: #8E8879;
    text-transform: uppercase;
  }
  .title {
    position: absolute;
    top: 54px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Fraunces Variable", serif;
    font-weight: 600;
    font-size: 34px;
    color: #15140E;
    letter-spacing: -0.01em;
  }
  .rule {
    position: absolute;
    top: 108px;
    left: 50%;
    transform: translateX(-50%);
    width: 64px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #FF5D73, #FFB454, #36D6C3, #6AA6FF, #B07BFF);
  }

  /* Drop-zone hints, centered under where Finder will place the real
     Galley.app icon (180,205) and the Applications alias (480,205) —
     coordinates are icon *centers* in the create-dmg call below. */
  .zone {
    position: absolute;
    top: 145px;
    width: 128px;
    height: 128px;
    border-radius: 20px;
  }
  .zone.left { left: 116px; }
  .zone.right { left: 416px; }

  .arrow {
    position: absolute;
    top: 195px;
    left: 274px;
    width: 112px;
    height: 40px;
  }
  .arrow svg { width: 100%; height: 100%; display: block; }

  .caption {
    position: absolute;
    top: 300px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Inter Variable", sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #4A4639;
  }
  .subcaption {
    position: absolute;
    top: 324px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Inter Variable", sans-serif;
    font-size: 12px;
    color: #8E8879;
  }

  .frame {
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(21,20,14,0.08);
    border-radius: 14px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="frame"></div>
  <div class="eyebrow">Galley &middot; a reader</div>
  <div class="title">Install Galley</div>
  <div class="rule"></div>

  <div class="zone left"></div>
  <div class="zone right"></div>

  <div class="arrow">
    <svg viewBox="0 0 112 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 20 H96" stroke="#B7AF9C" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/>
      <path d="M84 8 L100 20 L84 32" stroke="#B7AF9C" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <div class="caption">Drag Galley into Applications</div>
  <div class="subcaption">then open it from there — like any other Mac app</div>
</body>
</html>
