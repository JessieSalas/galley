name: Galley
options:
  bundleIdPrefix: do.thesis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1.6"
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 922HAZ57Q8
    ENABLE_HARDENED_RUNTIME: true
    DEAD_CODE_STRIPPING: true

targets:
  Galley:
    type: application
    platform: macOS
    sources:
      - Galley/App
      - Galley/Views
      - Galley/Core
      - path: Galley/Resources/web
        type: folder
        buildPhase: resources
      - path: Galley/Resources/Samples
        type: folder
        buildPhase: resources
      - Galley/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: do.thesis.galley
        PRODUCT_NAME: Galley
        INFOPLIST_FILE: Galley/Info.plist
        CODE_SIGN_ENTITLEMENTS: Galley/Galley.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
    dependencies:
      - target: GalleyQuickLook
        embed: true
      - target: GalleyThumbnail
        embed: true

  GalleyQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook/PreviewProvider.swift
      - path: QuickLook/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: do.thesis.galley.quicklook
        PRODUCT_NAME: GalleyQuickLook
        INFOPLIST_FILE: QuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickLook/QuickLook.entitlements
        SKIP_INSTALL: true

  GalleyThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Thumbnail/ThumbnailProvider.swift
      - Thumbnail/ThumbnailRenderer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: do.thesis.galley.thumbnail
        PRODUCT_NAME: GalleyThumbnail
        INFOPLIST_FILE: Thumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: Thumbnail/Thumbnail.entitlements
        SKIP_INSTALL: true

  GalleyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GalleyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: do.thesis.galley.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Galley.app/Contents/MacOS/Galley"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Galley
        embed: false

schemes:
  Galley:
    build:
      targets:
        Galley: all
        GalleyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GalleyTests
    archive:
      config: Release
